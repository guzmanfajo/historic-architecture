<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Historic Architecture</title>
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/contact.css">
    <script src="js/main.js" defer></script>
</head>
<body>

    <header>
        <div class="header-top">
            <div class="site-title">
                <a href="index.html">Historic Architecture</a>
            </div>

            <button class="menu-toggle" aria-label="Open menu">
                ☰
            </button>
        </div>

        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About</a>
            <a href="contact.html">Contact</a>
        </nav>
    </header>

    <main>

        <section class="contact-hero">

            <h2>Contact Me</h2>

            <div class="contact-line"></div>

            <p class="contact-description">
                Have a question, suggestion, or wish to discuss architecture, history, 
                or future collaborations? Feel free to reach out.
            </p>

        </section>

        <section class="contact-container">

            <form 
                class="contact-form"
                action="https://formsubmit.co/guzmanfajo@gmail.com"
                method="POST"
            >

                <input type="hidden" name="_captcha" value="false">
                <input type="hidden" name="_subject" value="New message from historic-architecture">
                <input type="hidden" name="_next" value="https://guzmanfajo.github.io/historic-architecture/contact.html">
                
                <input 
                    type="text"
                    name="name"
                    placeholder="Full Name"
                    required
                >

                <input 
                    type="email"
                    name="email"
                    placeholder="Email Address"
                    required
                >

                <textarea
                    name="message"
                    placeholder="Your Message"
                    rows="6"
                    required
                ></textarea>
                
                <button type="submit">Send Message</button>
            </form>
        </section>

    </main>

    <footer>
        <div class="footer-content">
            <p class="footer-title">
                <a href="index.html">Historic Architecture</a>
            </p>
            <p class="footer-copy">© 2026 Guzmán Fajo. All rights reserved.</p>
        </div>
    </footer>
    
</body>
